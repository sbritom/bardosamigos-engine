name: Portal Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Portal tests
        run: npm run portal:test

      - name: Production build
        run: npm run build

      - name: Release smoke
        run: npm run portal:release-smoke

      - name: Performance budget
        run: npm run portal:budget
