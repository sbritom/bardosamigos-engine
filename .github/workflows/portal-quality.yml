name: Portal Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: portal-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Normalize hook dependencies once
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/architecture-hardening-10'
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'src/apps/radio/RadioPage.jsx',
              '''  const activeProgram = radioPrograms[activeProgramIndex] || null;\n  const todayScheduleDay = useMemo(() => {\n    const day = new Date().getDay();\n    return day === 0 ? 7 : day;\n  }, [metadata.updatedAt]);\n  const nextRadioSlot = useMemo(\n    () => getUpcomingRadioSlot(radioSchedule, new Date()),\n    [metadata.updatedAt, radioSchedule],\n  );''',
              '''  const activeProgram = radioPrograms[activeProgramIndex] || null;\n  const scheduleReferenceTime = useMemo(() => {\n    const candidate = metadata.updatedAt ? new Date(metadata.updatedAt) : new Date();\n    return Number.isNaN(candidate.getTime()) ? new Date() : candidate;\n  }, [metadata.updatedAt]);\n  const todayScheduleDay = useMemo(() => {\n    const day = scheduleReferenceTime.getDay();\n    return day === 0 ? 7 : day;\n  }, [scheduleReferenceTime]);\n  const nextRadioSlot = useMemo(\n    () => getUpcomingRadioSlot(radioSchedule, scheduleReferenceTime),\n    [radioSchedule, scheduleReferenceTime],\n  );''',
          )

          replace(
              'src/modules/competition/predictions/pages/CompetitionPredictionsPage.jsx',
              "import { useEffect, useMemo, useState } from 'react'",
              "import { useCallback, useEffect, useMemo, useState } from 'react'",
          )
          replace(
              'src/modules/competition/predictions/pages/CompetitionPredictionsPage.jsx',
              '''  async function loadMyPredictions() {\n    if (!isAuthenticated) {\n      setMyPredictions([])\n      setSecondaryError('')\n      return\n    }\n\n    setSecondaryLoading(true)\n    const result = await listMyCompetitionPredictions()\n    setMyPredictions(result.data || [])\n    setSecondaryError(result.error?.message || '')\n    setSecondaryLoading(false)\n  }\n\n  async function loadRanking() {\n    setSecondaryLoading(true)\n    const result = await listLatestCompetitionRanking('general')\n    setRanking(result.data)\n    setSecondaryError(result.error?.message || '')\n    setSecondaryLoading(false)\n  }''',
              '''  const loadMyPredictions = useCallback(async () => {\n    if (!isAuthenticated) {\n      setMyPredictions([])\n      setSecondaryError('')\n      return\n    }\n\n    setSecondaryLoading(true)\n    const result = await listMyCompetitionPredictions()\n    setMyPredictions(result.data || [])\n    setSecondaryError(result.error?.message || '')\n    setSecondaryLoading(false)\n  }, [isAuthenticated])\n\n  const loadRanking = useCallback(async () => {\n    setSecondaryLoading(true)\n    const result = await listLatestCompetitionRanking('general')\n    setRanking(result.data)\n    setSecondaryError(result.error?.message || '')\n    setSecondaryLoading(false)\n  }, [])''',
          )
          replace(
              'src/modules/competition/predictions/pages/CompetitionPredictionsPage.jsx',
              "  }, [activeTab, isAuthenticated])",
              "  }, [activeTab, loadMyPredictions, loadRanking])",
          )

          replace(
              'src/modules/tv/admin/TVChannelManager.jsx',
              "  }, [load])",
              "  }, [filters.search, load])",
          )

          replace(
              'src/modules/tv/pages/TVPage.jsx',
              "  }, [favoriteIds, favoritePendingIds, isAuthenticated, openAuth, user?.id])",
              "  }, [favoriteIds, favoritePendingIds, isAuthenticated, openAuth, user])",
          )
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps/radio/RadioPage.jsx \
                  src/modules/competition/predictions/pages/CompetitionPredictionsPage.jsx \
                  src/modules/tv/admin/TVChannelManager.jsx \
                  src/modules/tv/pages/TVPage.jsx
          git commit -m "chore: zera warnings de hooks do portal"
          git push origin HEAD:${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Portal tests
        run: npm run portal:test

      - name: Production build
        run: npm run build

      - name: Release smoke
        run: npm run portal:release-smoke

      - name: Performance budget
        run: npm run portal:budget
