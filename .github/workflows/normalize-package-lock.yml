name: Normalize Package Lock

on:
  push:
    branches: [chore/normalize-package-lock]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/normalize-package-lock

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit normalized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: normalize package lock"
          git push origin HEAD:chore/normalize-package-lock
