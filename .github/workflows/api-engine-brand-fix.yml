name: ApiEngine Brand Fix

on:
  push:
    branches:
      - chore/remove-bar-dos-amigos-legacy

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip api brand fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Replace legacy ApiEngine identity
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('server/src/api/ApiEngine.js')
          source = path.read_text(encoding='utf-8')
          updated = source.replace('Radio Bar Dos Amigos', 'Radio IMORTAL0800')
          updated = updated.replace('Radio-Bar-dos-Amigos/1.0', 'IMORTAL0800-Radio/1.0')
          if updated != source:
              path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No ApiEngine branding changes required.'
            exit 0
          fi
          git config user.name 'Gianlucca'
          git config user.email '106834389+sbritom@users.noreply.github.com'
          git add server/src/api/ApiEngine.js
          git commit -m 'Remove legacy ApiEngine branding [skip api brand fix]'
          git push origin HEAD:chore/remove-bar-dos-amigos-legacy
