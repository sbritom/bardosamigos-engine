name: Purge leaked historical refs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Remove historical tags that retain leaked credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in ui-v2.0 v1.0.0 v1.1.0; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" || true
          done

      - name: Remove legacy v1.0.0 release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/363642262" || true

      - name: Verify historical tags are gone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          refs="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/" --jq '.[].ref')"
          if printf '%s\n' "$refs" | grep -E 'refs/tags/(ui-v2\.0|v1\.0\.0|v1\.1\.0)$'; then
            echo "Historical tag purge failed."
            exit 1
          fi
          echo "Historical tags removed."
