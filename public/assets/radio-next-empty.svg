<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Próximo na Rádio</title>
  <desc id="desc">Arte escura com rádio, ondas sonoras e equalizador em azul e roxo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04080f"/>
      <stop offset="0.55" stop-color="#071426"/>
      <stop offset="1" stop-color="#03060b"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="76%" cy="46%" r="48%">
      <stop offset="0" stop-color="#1ca8ff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#1378ff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#1378ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="88%" cy="28%" r="38%">
      <stop offset="0" stop-color="#9658ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9658ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60dcff"/>
      <stop offset="0.5" stop-color="#1b8fff"/>
      <stop offset="1" stop-color="#9f5cff"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#04080f" stop-opacity="0.97"/>
      <stop offset="0.46" stop-color="#04080f" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#04080f" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#blueGlow)"/>
  <rect width="900" height="500" fill="url(#purpleGlow)"/>

  <g transform="translate(570 118)" opacity="0.9">
    <rect x="0" y="0" width="230" height="180" rx="28" fill="#071421" stroke="url(#neon)" stroke-width="4"/>
    <circle cx="68" cy="90" r="43" fill="#0b1c2b" stroke="#59d5ff" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="68" cy="90" r="18" fill="#10283b" stroke="#8c5cff" stroke-opacity="0.65" stroke-width="3"/>
    <rect x="128" y="48" width="68" height="12" rx="6" fill="#1b8fff" opacity="0.9"/>
    <rect x="128" y="76" width="50" height="9" rx="4.5" fill="#65dbff" opacity="0.55"/>
    <rect x="128" y="101" width="76" height="9" rx="4.5" fill="#8c5cff" opacity="0.48"/>
    <rect x="128" y="126" width="58" height="9" rx="4.5" fill="#2fa8ff" opacity="0.48"/>
    <circle cx="184" cy="25" r="6" fill="#61dcff"/>
  </g>

  <g fill="none" stroke="url(#neon)" stroke-linecap="round" filter="url(#glow)" opacity="0.6">
    <path d="M760 84c50 21 82 69 82 122" stroke-width="6"/>
    <path d="M777 52c74 31 121 102 121 181" stroke-width="4"/>
    <path d="M742 117c29 12 48 40 48 71" stroke-width="8"/>
  </g>

  <g transform="translate(475 342)" opacity="0.76">
    <rect x="0" y="58" width="10" height="28" rx="5" fill="#2198ff"/>
    <rect x="24" y="35" width="10" height="51" rx="5" fill="#58d6ff"/>
    <rect x="48" y="49" width="10" height="37" rx="5" fill="#2caaff"/>
    <rect x="72" y="18" width="10" height="68" rx="5" fill="#8f5cff"/>
    <rect x="96" y="42" width="10" height="44" rx="5" fill="#2b9dff"/>
    <rect x="120" y="29" width="10" height="57" rx="5" fill="#5b7fff"/>
    <rect x="144" y="55" width="10" height="31" rx="5" fill="#2ca8ff"/>
    <rect x="168" y="24" width="10" height="62" rx="5" fill="#a15cff"/>
    <rect x="192" y="45" width="10" height="41" rx="5" fill="#57d7ff"/>
    <rect x="216" y="31" width="10" height="55" rx="5" fill="#348eff"/>
    <rect x="240" y="52" width="10" height="34" rx="5" fill="#7d62ff"/>
  </g>

  <path d="M390 250c42-48 84 48 126 0s84 48 126 0 84 48 126 0 84 48 126 0" fill="none" stroke="#55d4ff" stroke-opacity="0.18" stroke-width="3"/>
  <path d="M420 278c36-31 72 31 108 0s72 31 108 0 72 31 108 0" fill="none" stroke="#a45fff" stroke-opacity="0.14" stroke-width="2"/>

  <rect width="900" height="500" fill="url(#fade)"/>
</svg>
