<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Estúdio de rádio abstrato</title>
  <desc id="desc">Arte escura com microfone, fones e barras de áudio em azul e roxo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b15"/>
      <stop offset="0.5" stop-color="#071426"/>
      <stop offset="1" stop-color="#04070d"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="68%" cy="46%" r="48%">
      <stop offset="0" stop-color="#159dff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#0b78ff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0b78ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="83%" cy="33%" r="42%">
      <stop offset="0" stop-color="#9f54ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#9f54ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#51d6ff"/>
      <stop offset="0.48" stop-color="#168cff"/>
      <stop offset="1" stop-color="#9a56ff"/>
    </linearGradient>
    <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05090f" stop-opacity="0.96"/>
      <stop offset="0.48" stop-color="#05090f" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#05090f" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#glowBlue)"/>
  <rect width="900" height="500" fill="url(#glowPurple)"/>

  <g opacity="0.2" filter="url(#blur20)">
    <circle cx="690" cy="250" r="110" fill="#0b78ff"/>
    <circle cx="785" cy="170" r="70" fill="#8d51ff"/>
  </g>

  <g transform="translate(615 78)" opacity="0.92">
    <path d="M88 24c36 0 65 29 65 65v105c0 36-29 65-65 65s-65-29-65-65V89c0-36 29-65 65-65Z" fill="#071522" stroke="url(#neon)" stroke-width="5"/>
    <rect x="50" y="72" width="76" height="140" rx="38" fill="#091d2d" stroke="#58d4ff" stroke-opacity="0.45" stroke-width="2"/>
    <g stroke="#5ecfff" stroke-opacity="0.28" stroke-width="3">
      <path d="M66 98h44"/><path d="M62 122h52"/><path d="M62 146h52"/><path d="M66 170h44"/>
    </g>
    <path d="M5 163v30c0 49 37 89 83 89s83-40 83-89v-30" fill="none" stroke="url(#neon)" stroke-width="6" stroke-linecap="round"/>
    <path d="M88 282v74" stroke="#52cfff" stroke-width="6" stroke-linecap="round"/>
    <path d="M45 360h86" stroke="#52cfff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g transform="translate(520 78)" opacity="0.5" fill="none" stroke="url(#neon)" stroke-width="6" stroke-linecap="round" filter="url(#glow)">
    <path d="M12 122C18 38 70 0 132 0s114 38 120 122"/>
    <path d="M11 123v78c0 20 14 36 32 36h11v-111H43c-18 0-32 16-32 36Z"/>
    <path d="M253 123v78c0 20-14 36-32 36h-11v-111h11c18 0 32 16 32 36Z"/>
  </g>

  <g transform="translate(455 355)" opacity="0.72">
    <rect x="0" y="54" width="12" height="34" rx="6" fill="#159dff"/>
    <rect x="28" y="28" width="12" height="60" rx="6" fill="#44c9ff"/>
    <rect x="56" y="42" width="12" height="46" rx="6" fill="#159dff"/>
    <rect x="84" y="12" width="12" height="76" rx="6" fill="#8f5cff"/>
    <rect x="112" y="38" width="12" height="50" rx="6" fill="#2ba9ff"/>
    <rect x="140" y="22" width="12" height="66" rx="6" fill="#5d7cff"/>
    <rect x="168" y="48" width="12" height="40" rx="6" fill="#1a8fff"/>
    <rect x="196" y="16" width="12" height="72" rx="6" fill="#a55aff"/>
    <rect x="224" y="34" width="12" height="54" rx="6" fill="#4ecfff"/>
  </g>

  <path d="M395 252c56-58 112 58 168 0s112 58 168 0 112 58 168 0" fill="none" stroke="#42c8ff" stroke-opacity="0.18" stroke-width="3"/>
  <path d="M410 278c48-38 96 38 144 0s96 38 144 0 96 38 144 0" fill="none" stroke="#9a56ff" stroke-opacity="0.14" stroke-width="2"/>

  <rect width="900" height="500" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="899" height="499" rx="28" fill="none" stroke="#56cfff" stroke-opacity="0.05"/>
</svg>